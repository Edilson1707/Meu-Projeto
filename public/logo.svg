<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filter for subtle drop shadow / clean sticker effect if needed -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Group for entire logo centered -->
  <g transform="translate(0, 0)">
    <!-- EMBLEM / SYMBOL (Center: 250, 160) -->
    <g transform="translate(250, 160)">
      
      <!-- Outer white sticker backing / halo for symbol -->
      <!-- Green Swoosh (Left energy crescent) -->
      <!-- Curves from bottom-center sweeping up around the left side -->
      <path
        d="M -12,88 
           C -55,85 -95,45 -95,-10 
           C -95,-45 -82,-75 -65,-95
           C -62,-80 -52,-55 -35,-35
           C -50,-10 -52,25 -25,55 
           C -12,68 5,75 25,78
           C 5,84 -4,87 -12,88 Z"
        fill="#009B3A"
      />

      <!-- Blue Swoosh (Right energy crescent) -->
      <!-- Curves from top-center sweeping down around the right side -->
      <path
        d="M 12,-88 
           C 55,-85 95,-45 95,10 
           C 95,45 82,75 65,95
           C 62,80 52,55 35,35
           C 50,10 52,-25 25,-55 
           C 12,-68 -5,-75 -25,-78
           C -5,-84 4,-87 12,-88 Z"
        fill="#002776"
      />

      <!-- Central Yellow Lightning Bolt -->
      <!-- Tilted dynamic electrical lightning bolt with sharp vertices -->
      <path
        d="M 5,-105 
           L -42,5 
           L -4,8 
           L -18,105 
           L 52,-15 
           L 12,-18 
           Z"
        fill="#FFC700"
        stroke="#FFB800"
        stroke-width="1.5"
        stroke-linejoin="round"
      />
    </g>

    <!-- TYPOGRAPHY: SÓ PADRÕES -->
    <g transform="translate(250, 370)">
      <!-- Custom drawn stylized geometric bold letters "SÓ PADRÕES" matching the uploaded logo -->
      
      <!-- "S" (centered around X: -190) -->
      <path
        d="M -208,-38 L -175,-38 L -172,-16 L -192,-12 L -190,-2 L -172,3 L -173,28 L -208,28 L -210,6 L -190,1 L -192,-12 L -210,-17 Z"
        fill="#0A0A0A"
      />

      <!-- "Ó" (centered around X: -145) with acute accent -->
      <!-- Acute Accent -->
      <polygon points="-147,-52 -136,-64 -128,-60 -138,-48" fill="#0A0A0A" />
      <!-- Letter Ó Body (angular octagonal ring) -->
      <path
        d="M -160,-38 L -128,-38 L -120,-22 L -120,12 L -128,28 L -160,28 L -168,12 L -168,-22 Z
           M -152,-20 L -152,10 L -148,15 L -138,15 L -134,10 L -134,-20 L -138,-25 L -148,-25 Z"
        fill-rule="evenodd"
        fill="#0A0A0A"
      />

      <!-- SPACE BETWEEN WORDS (gap between Ó and P) -->

      <!-- "P" (centered around X: -82) -->
      <path
        d="M -100,-38 L -68,-38 L -60,-24 L -60,-2 L -68,12 L -84,12 L -84,28 L -100,28 Z
           M -84,-22 L -84,-2 L -78,-2 L -74,-6 L -74,-18 L -78,-22 Z"
        fill-rule="evenodd"
        fill="#0A0A0A"
      />

      <!-- "A" (centered around X: -30) -->
      <path
        d="M -40,-38 L -18,-38 L -8,28 L -24,28 L -27,14 L -43,14 L -46,28 L -62,28 Z
           M -32,-22 L -39,0 L -31,0 Z"
        fill-rule="evenodd"
        fill="#0A0A0A"
      />

      <!-- "D" (centered around X: 22) -->
      <path
        d="M 6,-38 L 36,-38 L 48,-22 L 48,12 L 36,28 L 6,28 Z
           M 22,-22 L 22,12 L 30,12 L 34,6 L 34,-16 L 30,-22 Z"
        fill-rule="evenodd"
        fill="#0A0A0A"
      />

      <!-- "R" (centered around X: 75) -->
      <path
        d="M 60,-38 L 92,-38 L 100,-24 L 100,-2 L 92,10 L 80,10 L 98,28 L 80,28 L 66,10 L 76,10 L 76,-22 L 60,-22 Z
           M 76,-24 L 76,-4 L 82,-4 L 86,-8 L 86,-20 L 82,-24 Z"
        fill="#0A0A0A"
      />

      <!-- "Õ" (centered around X: 130) with tilde -->
      <!-- Tilde Accent ~ -->
      <path
        d="M 116,-56 C 122,-62 128,-62 134,-57 C 138,-53 143,-53 148,-56 L 150,-51 C 144,-46 138,-46 132,-51 C 128,-54 123,-54 118,-51 Z"
        fill="#0A0A0A"
      />
      <!-- Letter Õ Body -->
      <path
        d="M 114,-38 L 146,-38 L 154,-22 L 154,12 L 146,28 L 114,28 L 106,12 L 106,-22 Z
           M 122,-20 L 122,10 L 126,15 L 136,15 L 140,10 L 140,-20 L 136,-25 L 126,-25 Z"
        fill-rule="evenodd"
        fill="#0A0A0A"
      />

      <!-- "E" (centered around X: 182) -->
      <path
        d="M 166,-38 L 202,-38 L 198,-24 L 182,-24 L 182,-12 L 196,-12 L 192,2 L 182,2 L 182,14 L 202,14 L 198,28 L 166,28 Z"
        fill="#0A0A0A"
      />

      <!-- "S" (centered around X: 228) -->
      <path
        d="M 212,-38 L 245,-38 L 248,-16 L 228,-12 L 230,-2 L 248,3 L 247,28 L 212,28 L 210,6 L 230,1 L 228,-12 L 210,-17 Z"
        fill="#0A0A0A"
      />
    </g>
  </g>
</svg>
